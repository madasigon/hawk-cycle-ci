name: publish-pypi

# Publishes the `hawk` package to PyPI via Trusted Publishing (OIDC, no API
# token). release-please cuts each GitHub Release with a GitHub App token, so the
# `release: published` event fires and auto-publishes the new tag. workflow_dispatch
# lets us (re)publish an existing tag by hand (e.g. backfilling older releases) —
# it checks out the source at that tag and builds it, so the workflow definition
# is always taken from the dispatched branch while the artifact matches the tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish, e.g. v2.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  UV_VERSION: 0.12.3

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "${{ env.UV_VERSION }}"

      # The distributable package lives in the hawk/ subdirectory.
      - name: Build sdist and wheel
        run: uv build hawk --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/hawk/
    permissions:
      # Required for Trusted Publishing (OIDC). No PyPI API token is used.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Tolerate re-dispatching a tag that already published (e.g. a partial
          # backfill re-run); a genuinely new release always has a fresh version.
          skip-existing: true
