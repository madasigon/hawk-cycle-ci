name: OIDC Debug
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  claims:
    runs-on: ubuntu-24.04
    environment: full-cycle-sandbox
    steps:
      - name: Print OIDC claims (sub, aud, iss)
        run: |
          set -euo pipefail
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          P=$(echo "$T" | cut -d. -f2 | tr '_-' '/+' ); while [ $(( ${#P} % 4 )) -ne 0 ]; do P="$P="; done
          echo "$P" | base64 -d | jq '{sub, aud, iss, environment, ref, repository}'
